admissionController:
  replicas: 3
  pdb:
    create: true
    minAvailable: 1
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

# Background controller handles generating and mutating existing resources
backgroundController:
  replicas: 2
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

# Reports controller handles policy reports
reportsController:
  replicas: 2
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

# Cleanup controller handles removing stale resources/reports
cleanupController:
  replicas: 2

# Ensures webhook configurations are updated smoothly
webhooks:
  timeoutSeconds: 15